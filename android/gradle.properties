# Keep the Android release build inside machines with about 7 GB of RAM.
# The previous 8 GB heap plus a 4 GB metaspace limit could be killed by Linux
# before Gradle had a chance to report an out-of-memory error.
org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=96m
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
