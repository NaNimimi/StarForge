# Keep the Android release build inside machines with about 7 GB of RAM.
# The previous 8 GB heap plus a 4 GB metaspace limit could be killed by Linux
# before Gradle had a chance to report an out-of-memory error.
org.gradle.jvmargs=-Xmx2304m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
org.gradle.workers.max=1
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
